name: Build Minecraft mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach the built JAR to a GitHub prerelease
        type: boolean
        required: false
        default: false
      release_tag:
        description: Release tag (for example v1.0.0)
        type: string
        required: false
        default: v1.0.0

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.10.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Compile and test
        shell: bash
        run: |
          mkdir -p .ci-logs
          set +e
          gradle --no-daemon --stacktrace clean build 2>&1 | tee .ci-logs/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostic=$(grep -A3 -B1 -E '(What went wrong:|error:|Could not|NoSuch|Exception|FAILED)' .ci-logs/build.log | tail -n 40 | tr '\n' ' ' | cut -c1-5000)
            if [ -z "$diagnostic" ]; then diagnostic=$(tail -n 25 .ci-logs/build.log | tr '\n' ' ' | cut -c1-5000); fi
            echo "::error title=Gradle build failure::${diagnostic:-See build.log artifact}"
          fi
          exit "$result"
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cryonite-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish JAR to GitHub Releases
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" build/libs/*.jar --title "Cryonite $RELEASE_TAG" --notes "NeoForge 1.21.1 / Java 21 build, compiled by GitHub Actions from $GITHUB_SHA." --target "$GITHUB_SHA" --prerelease
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cryonite-build-reports-${{ github.sha }}
          path: |
            .ci-logs/build.log
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
