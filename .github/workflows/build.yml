name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile
        id: compile
        run: |
          set -o pipefail
          ./gradlew compileJava --stacktrace 2>&1 | tee compile.log

      - name: Run data generators
        id: datagen
        if: steps.compile.outcome == 'success' && hashFiles('src/main/java/**/datagen/*.java') != ''
        run: |
          set -o pipefail
          ./gradlew runData 2>&1 | tee datagen.log

      - name: Build
        id: build
        if: steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Run GameTests
        id: gametest
        if: steps.build.outcome == 'success' && hashFiles('src/main/java/**/gametest/*.java') != ''
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log

      - name: Commit generated resources
        if: steps.datagen.outcome == 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/generated
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate data (runData)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          python3 .github/scripts/report.py
          compile=${{ steps.compile.outcome }}
          datagen=${{ steps.datagen.outcome }}
          build=${{ steps.build.outcome }}
          gametest=${{ steps.gametest.outcome }}

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cryonite-jar
          path: build/libs/*.jar
