plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'dev.cryonite'
version = '1.0.0'
base { archivesName = 'cryonite' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { data(); programArguments.addAll '--mod', 'cryonite', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath() }
    }
    mods { cryonite { sourceSet sourceSets.main } }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

 tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
